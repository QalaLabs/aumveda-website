# ==============================================================================
# Google Cloud Build Configuration for Aumveda Web Service
# Builds container image and deploys to Google Cloud Run
# ==============================================================================
steps:
  # 1. Build Docker image with caching
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aumveda-web:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aumveda-web:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # 2. Push container image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/aumveda-web:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/aumveda-web:latest'

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/aumveda-web:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--cpu-boost'
      - '--set-env-vars=NODE_ENV=production,HOSTNAME=0.0.0.0'

substitutions:
  _SERVICE_NAME: 'aumveda-web'
  _REGION: 'asia-south1'

images:
  - 'gcr.io/$PROJECT_ID/aumveda-web:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/aumveda-web:latest'

options:
  logging: CLOUD_LOGGING_ONLY
